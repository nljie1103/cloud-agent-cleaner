name: tests

on:
  push:
    paths-ignore:
      - '.source-parts/**'
      - '.github/workflows/assemble-source.yml'
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'pull_request' || github.actor == 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile cloud_agent_cleaner.py
      - name: Test
        run: python -m unittest -v tests/smoke.py
      - name: Audit smoke test
        run: python cloud_agent_cleaner.py --audit --provider aws
