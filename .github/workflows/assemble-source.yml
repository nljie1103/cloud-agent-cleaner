name: assemble-source-once

on:
  push:
    paths:
      - '.source-parts/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for all source parts
        id: parts
        shell: bash
        run: |
          count=$(find .source-parts -maxdepth 1 -type f -name 'part*.b64' 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -ne 5 ]; then
            echo "Waiting for 5 source parts; currently have $count."
          fi
      - name: Assemble, verify and test
        if: steps.parts.outputs.count == '5'
        shell: bash
        run: |
          cat .source-parts/part00.b64 \
              .source-parts/part01.b64 \
              .source-parts/part02.b64 \
              .source-parts/part03.b64 \
              .source-parts/part04.b64 \
            | base64 --decode > cloud_agent_cleaner.py
          echo '1feaf6ac344723a7c716bb76c865ee3eecb9d4955a650919df4fa7962a7f5b56  cloud_agent_cleaner.py' | sha256sum --check
          python3 -m py_compile cloud_agent_cleaner.py
          python3 -m unittest -v tests/smoke.py
      - name: Commit assembled source and remove staging files
        if: steps.parts.outputs.count == '5'
        shell: bash
        run: |
          rm -rf .source-parts
          rm -f .github/workflows/assemble-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add cloud agent cleaner implementation'
          git pull --rebase origin main
          git push
