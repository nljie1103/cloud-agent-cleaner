name: assemble-source-once

on:
  push:
    paths:
      - '.source-parts/**'

concurrency:
  group: assemble-source
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check required source parts
        id: parts
        shell: bash
        run: |
          required=(
            .source-parts/part00.b64
            .source-parts/part01.b64
            .source-parts/part02.b64
            .source-parts/part03a.b64
            .source-parts/part03b.b64
            .source-parts/part04.b64
          )
          ready=true
          for path in "${required[@]}"; do
            if [ ! -f "$path" ]; then
              echo "Missing $path"
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Assemble, verify and test
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          names = ('part00', 'part01', 'part02', 'part03a', 'part03b', 'part04')
          encoded = ''.join(
              Path(f'.source-parts/{name}.b64').read_text(encoding='ascii')
              for name in names
          )
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected = '1feaf6ac344723a7c716bb76c865ee3eecb9d4955a650919df4fa7962a7f5b56'
          if digest != expected:
              raise SystemExit(f'SHA-256 mismatch: expected {expected}, received {digest}')
          Path('cloud_agent_cleaner.py').write_bytes(data)
          print(f'cloud_agent_cleaner.py: {digest}')
          PY
          python3 -m py_compile cloud_agent_cleaner.py
          python3 -m unittest -v tests/smoke.py
      - name: Commit assembled source and remove staging files
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          rm -rf .source-parts
          rm -f .github/workflows/assemble-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add cloud agent cleaner implementation'
          git pull --rebase origin main
          git push
